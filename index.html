<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; }
        .font-display { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-glow { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .game-card:hover img { transform: scale(1.1); }
        iframe { background: black; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass border-b border-white/10 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="closeGame()">
                <div class="bg-blue-600 p-2 rounded-lg neon-glow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-gamepad-2"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15" y1="13" y2="13"/><line x1="18" x2="18" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/><path d="M9 18v2"/><path d="M15 18v2"/></svg>
                </div>
                <h1 class="text-2xl font-display font-extrabold tracking-tighter uppercase">
                    FREEDOM <span class="text-blue-500">V2</span>
                </h1>
            </div>

            <div class="relative group">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/40"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search games..."
                    class="bg-white/5 border border-white/10 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-blue-500/50 w-48 md:w-64 transition-all"
                >
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-8">
        <!-- Game Player (Hidden by default) -->
        <div id="game-player" class="hidden space-y-6 mb-12">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button onclick="closeGame()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                    <div>
                        <h2 id="current-game-title" class="text-2xl font-display font-bold">Game Title</h2>
                        <p id="current-game-category" class="text-white/40 text-sm">Category</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleFullscreen()" class="flex items-center gap-2 px-4 py-2 glass rounded-lg hover:bg-white/10 transition-colors text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                        Fullscreen
                    </button>
                </div>
            </div>
            <div id="player-container" class="aspect-video w-full bg-black rounded-2xl overflow-hidden border border-white/10 shadow-2xl">
                <iframe id="game-iframe" class="w-full h-full border-none" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Home Content -->
        <div id="home-content" class="space-y-8">
            <div class="relative rounded-3xl overflow-hidden bg-gradient-to-br from-blue-900/20 to-purple-900/20 border border-white/5 p-12 text-center space-y-6">
                <h2 class="text-5xl md:text-7xl font-display font-black tracking-tighter uppercase">
                    Freedom <span class="text-blue-500">at last</span>
                </h2>
                <p class="text-white/60 max-w-2xl mx-auto text-lg">
                    Freedom V2 is your ultimate destination for high-quality, unblocked web games. 
                    No downloads, no restrictions, just pure gaming.
                </p>
            </div>

            <!-- Categories -->
            <div id="category-filters" class="flex flex-wrap items-center gap-3">
                <button onclick="filterByCategory('All')" class="cat-btn px-4 py-2 rounded-full text-sm font-medium bg-blue-600 text-white">All</button>
            </div>

            <!-- Games Grid -->
            <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Games will be injected here -->
            </div>
        </div>
    </main>

    <footer class="mt-auto border-t border-white/10 py-12 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="space-y-2 text-center md:text-left">
                <h1 class="text-xl font-display font-extrabold tracking-tighter uppercase">
                    FREEDOM <span class="text-blue-500">V2</span>
                </h1>
                <p class="text-sm text-white/40">aaron is a fuckass opp</p>
            </div>
            <div class="text-xs text-white/20">
                &copy; 2026 Freedom V2. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="src/games.js"></script>
    <script src="src/script.js"></script>
</body>
</html>
